# CI: runs on every pull request, and is reused by cd.yml before deploying.
# Order follows BACKEND-ARCHITECTURE section 10: ruff → mypy → lint-imports → unit → integration → api.
name: CI

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0  # this action publishes no major-version tag
        with:
          version: "0.13.9"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install packages
        run: uv sync --frozen

      - name: Ruff (lint + format)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy src tests migrations/env.py

      - name: Import rules (hexagonal)
        run: uv run lint-imports

      - name: Unit tests
        run: uv run pytest tests/unit

      - name: Integration tests (PostgreSQL in Docker, testcontainers)
        run: uv run pytest tests/integration

      - name: API tests
        run: uv run pytest tests/api

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: "12.6.0"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Prettier
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  backend-image:
    name: Backend Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Railway builds this same Dockerfile, so a broken image fails here first.
      - name: Build api image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/docker/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
