# Whole project for local machines: `docker compose up --build`
#   frontend http://localhost:8080 (nginx, forwards /api to the api)
#   api      http://localhost:8000/docs
#   postgres :5432, neo4j http://localhost:7474, redis :6379
# The worker is added once it has a background job (BACKEND-ARCHITECTURE section 11).
# The passwords below are for local machines only. Never use them in a real environment.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rehabgraph
      POSTGRES_PASSWORD: rehabgraph
      POSTGRES_DB: rehabgraph
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rehabgraph -d rehabgraph"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/change-me-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p change-me-neo4j 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    # All backend settings come from backend/.env (copy backend/.env.example).
    # DATABASE_URL there is used as is: a localhost URL goes to the postgres container,
    # a Neon URL goes to Neon (the postgres container still runs).
    env_file:
      - path: ./backend/.env
        required: true
    environment:
      DATABASE_LOCALHOST_ALIAS: postgres
      # Neo4j and Redis always run in this compose file: use the container names.
      NEO4J_URI: bolt://neo4j:7687
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: docker/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  neo4j-data:
